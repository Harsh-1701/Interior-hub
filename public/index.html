};

 {id:"demo-admin",name:"InteriorHub Admin",email:"admin@interiorhub.in",role:"admin",status:"Active"}
];

base.authView="signup";
base.realtime={connected:false};
const API_BASE=(new URLSearchParams(location.search).get("api")||window.INTERIORHUB_API||((location.protocol!=="file:")?location.origin:"http://localhost:8787")).replace(/\/$/,"");
let apiOnline=false;
let apiUser=null;
let syncTimer=null;

async function apiFetch(path,options={}){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),5000);
 try{
  const res=await fetch(API_BASE+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})},credentials:"include",signal:controller.signal});
  clearTimeout(timer);
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"Request failed");
  return data;
 }catch(e){clearTimeout(timer);throw e}
}
async function checkBackend(){
 try{const r=await apiFetch("/api/health");apiOnline=!!r.ok;renderConnectionBadge()}
 catch(e){apiOnline=false;renderConnectionBadge()}
}
function renderConnectionBadge(){
 const label=apiOnline?((state.realtime?.connected)?"Backend connected · live messaging":"Backend connected"):"Backend unavailable";
 const el=document.getElementById("connectionStatus");
 if(el) el.innerHTML=apiOnline?'<span class="status-dot online"></span>'+label:'<span class="status-dot offline"></span>'+label;
 const authEl=document.getElementById("authBackendStatus");
 if(authEl) authEl.innerHTML=apiOnline?'<span class="status-dot online"></span> Secure backend connected':'<span class="status-dot offline"></span> Backend unavailable — start the InteriorHub server or open the deployed site';
}
function queueBackendSync(){
 if(!API_BASE || !state.auth?.loggedIn)return;
 clearTimeout(syncTimer);
 syncTimer=setTimeout(async()=>{
  try{
   await apiFetch("/api/state",{method:"PUT",headers:state.auth.token?{"Authorization":"Bearer "+state.auth.token}:{} ,body:JSON.stringify({state})});
   apiOnline=true;renderConnectionBadge();
  }catch(e){apiOnline=false;renderConnectionBadge()}
 },500);
}

let state=load();
syncRoleFromAccount();
checkBackend();
if(state.auth?.loggedIn) hydrateBackend();
function authHeaders(){return state.auth?.token?{"Authorization":"Bearer "+state.auth.token}:{} }
async function hydrateBackend(){
 try{
  const me=await apiFetch("/api/me",{headers:authHeaders()});
  state.auth={loggedIn:true,token:state.auth.token||null,user:me.user};
  syncRoleFromAccount();
  const r=await apiFetch("/api/state",{headers:authHeaders()});
  if(r.state){const keep={auth:state.auth,toast:state.toast,authView:state.authView,realtime:state.realtime};Object.assign(state,r.state);Object.assign(state,keep);syncRoleFromAccount();localStorage.setItem(KEY,JSON.stringify(state));}
  else {await apiFetch("/api/state",{method:"PUT",headers:authHeaders(),body:JSON.stringify({state})});}
  try{const mr=await apiFetch("/api/messages?projectId="+encodeURIComponent(state.project.id),{headers:authHeaders()});if(Array.isArray(mr.messages))state.messages=mr.messages;}catch{}
  startRealtime(); render();
 }catch(e){
  state.auth={loggedIn:false,user:null,token:null}; state.authView="signup"; localStorage.setItem(KEY,JSON.stringify(state)); render();
 }
}
let eventSource=null;
function startRealtime(){
 if(eventSource) eventSource.close();
 if(!state.auth?.loggedIn)return;
 const token=state.auth.token?encodeURIComponent(state.auth.token):"";
 eventSource=new EventSource(API_BASE+"/api/events?token="+token);
 eventSource.onopen=()=>{state.realtime.connected=true;renderConnectionBadge()};
 eventSource.onmessage=async ev=>{try{const msg=JSON.parse(ev.data);if(msg.type==="message"&&msg.message){if(!state.messages.some(x=>x.id===msg.message.id)){state.messages.push(msg.message);state.activities.unshift({text:"New project message received",time:"Just now"});save(false);render();}}}catch{}};
 eventSource.onerror=()=>{state.realtime.connected=false;renderConnectionBadge()};
}
function stopRealtime(){if(eventSource){eventSource.close();eventSource=null}state.realtime.connected=false}

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  const merged=structuredClone(base);
  if(x) Object.keys(x).forEach(k=>merged[k]=x[k]);
  // Never trust a cached logged-in flag by itself. A session token must exist;
  // the backend will validate that token during hydrateBackend().
  if(!x?.auth?.token){ merged.auth={loggedIn:false,user:null,token:null}; merged.authView="signup"; merged.authMethod="email"; }
  merged.auth=merged.auth||structuredClone(base.auth);
  merged.users=merged.users||structuredClone(base.users);
  merged.consultations=merged.consultations||[];
  merged.designerProfile=merged.designerProfile||structuredClone(base.designerProfile);
  merged.activityLog=merged.activityLog||[];
  merged.chatDraft=merged.chatDraft||{attachments:[],references:[]};
  merged.selectedProjectId=merged.selectedProjectId||merged.project?.id; merged.reminders=merged.reminders||[];
  return merged;
 }catch(e){return structuredClone(base)}
}
function save(sync=true){localStorage.setItem(KEY,JSON.stringify(state));if(sync)queueBackendSync()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){state.toast=msg;save();render();setTimeout(()=>{if(state.toast===msg){state.toast="";render()}},2200)}
function nav(p){state.page=p;state.tab="Overview";save();render()}
function openModal(content){const b=document.createElement("div");b.className="modal-backdrop";b.innerHTML=`<div class="modal">${content}</div>`;b.addEventListener("click",e=>{if(e.target===b)b.remove()});document.body.appendChild(b);return b}
function closeModal(){document.querySelector(".modal-backdrop")?.remove()}
function money(n){return "₹"+Number(n).toLocaleString("en-IN")}
function initials(n){return n.split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function roleLabel(){return state.role==="customer"?"Customer":state.role==="designer"?"Designer":"Admin"}
function syncRoleFromAccount(){
 const account=state.auth?.user;
 state.role=account?.role||"customer";
}

 // Roles are controlled by the signed-in account. There is intentionally no
 // customer/designer/admin switch inside the workspace.
 toast("Your workspace is controlled by your signed-in account.");
}

 save();closeModal();toast("Consultation request sent.");render()
}
function createProject(){
 const data={property:"Apartment",config:"2 BHK",area:"",city:"Bangalore",locality:"",requirements:[],budget:"₹8–12L",style:"Modern",notes:"",files:[]};
 let step=1;
 const requirements=["Living room","Kitchen","Master bedroom","Bedroom","Wardrobes","Pooja room","False ceiling","Lighting","Electrical","Civil work","Furniture"];
 const styles=["Modern","Minimal","Contemporary","Traditional","Luxury","Scandinavian","Industrial"];
 function body(){
  let inner="";
  if(step===1)inner=`<h2>Create project</h2><p class="sub">Property basics</p><div class="steps">${[1,2,3,4,5].map(i=>`<span class="step ${i<=step?"on":""}"></span>`).join("")}</div><div class="field"><label>Property type *</label><select id="ptype">${["Apartment","Villa","Independent House","Office"].map(x=>`<option ${x===data.property?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Configuration *</label><select id="pconfig">${["1 BHK","2 BHK","3 BHK","4 BHK","Other"].map(x=>`<option ${x===data.config?"selected":""}>${x}</option>`).join("")}</select></div><div class="grid g2"><div class="field"><label>Area (sq ft) *</label><input id="parea" value="${esc(data.area)}" type="number" placeholder="e.g. 1250"></div><div class="field"><label>City *</label><input id="pcity" value="${esc(data.city)}"></div></div><div class="field"><label>Area / locality</label><input id="plocality" value="${esc(data.locality)}" placeholder="e.g. Whitefield"></div>`;
  if(step===2)inner=`<h2>Requirements</h2><p class="sub">Choose everything you want included.</p><div class="steps">${[1,2,3,4,5].map(i=>`<span class="step ${i<=step?"on":""}"></span>`).join("")}</div><div class="checks">${requirements.map(r=>`<button class="check ${data.requirements.includes(r)?"selected":""}" onclick="this.classList.toggle('selected');projectWizardToggle('${r}')">${r}</button>`).join("")}</div>`;
  if(step===3)inner=`<h2>Budget</h2><p class="sub">Choose an approximate range.</p><div class="steps">${[1,2,3,4,5].map(i=>`<span class="step ${i<=step?"on":""}"></span>`).join("")}</div><div class="checks">${["₹3–5L","₹5–8L","₹8–12L","₹12–20L","₹20L+"].map(x=>`<button class="check ${data.budget===x?"selected":""}" onclick="projectWizardSet('budget','${x}')">${x}</button>`).join("")}</div>`;
  if(step===4)inner=`<h2>Preferred style</h2><p class="sub">Pick the visual direction.</p><div class="steps">${[1,2,3,4,5].map(i=>`<span class="step ${i<=step?"on":""}"></span>`).join("")}</div><div class="checks">${styles.map(x=>`<button class="check ${data.style===x?"selected":""}" onclick="projectWizardSet('style','${x}')">${x}</button>`).join("")}</div>`;
  if(step===5)inner=`<h2>Final details</h2><p class="sub">Anything the designer should know?</p><div class="steps">${[1,2,3,4,5].map(i=>`<span class="step ${i<=step?"on":""}"></span>`).join("")}</div><div class="field"><label>Additional requirements</label><textarea id="pnotes" rows="5" placeholder="Move-in date, priorities, reference ideas...">${esc(data.notes)}</textarea></div><div class="card flat"><b>Reference files</b><div class="muted">Floor plan / reference images (demo upload).</div><input id="pfiles" type="file" multiple style="margin-top:10px"></div>`;
  return inner+`<div class="row" style="margin-top:20px"><button class="btn" onclick="${step===1?"closeModal()":"projectWizardBack()"}">${step===1?"Cancel":"Back"}</button><button class="btn primary" onclick="projectWizardNext()">${step<5?"Continue":"Publish Project Brief"}</button></div>`
 }
 let m=openModal(body());
 window.projectWizardToggle=r=>{const i=data.requirements.indexOf(r);i>=0?data.requirements.splice(i,1):data.requirements.push(r);m.querySelector(".modal").innerHTML=body()};
 window.projectWizardSet=(k,v)=>{data[k]=v;m.querySelector(".modal").innerHTML=body()};
 window.projectWizardBack=()=>{capture();step--;m.querySelector(".modal").innerHTML=body()};
 window.projectWizardNext=()=>{if(!capture())return;if(step<5){step++;m.querySelector(".modal").innerHTML=body()}else{publishProject(data);m.remove()}};
 function capture(){
  if(step===1){data.property=m.querySelector("#ptype")?.value;data.config=m.querySelector("#pconfig")?.value;data.area=m.querySelector("#parea")?.value;data.city=m.querySelector("#pcity")?.value;data.locality=m.querySelector("#plocality")?.value;if(!data.area||!data.city){toast("Please complete the required property fields.");return false}}
  if(step===5){data.notes=m.querySelector("#pnotes")?.value||"";data.files=[...(m.querySelector("#pfiles")?.files||[])].map(f=>f.name)}
  return true
 }
}

function openCalendar(preselect){
 const baseDate=preselect?new Date(preselect+"T12:00:00"):new Date();
 let cursor=new Date(baseDate.getFullYear(),baseDate.getMonth(),1);
 let selected=preselect||baseDate.toISOString().slice(0,10);
 function draw(){
  const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let cells="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>cells+=`<div class="cal-day">${d}</div>`);
  for(let i=0;i<first;i++)cells+=`<div></div>`;
  for(let d=1;d<=days;d++){
   const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   const today=new Date(); const isToday=ds===today.toISOString().slice(0,10);
   cells+=`<button class="cal-cell ${ds===selected?"selected ":""}${isToday?"today":""}" onclick="window.__calendarPick('${ds}')">${d}</button>`;
  }
  const modal=document.querySelector(".modal");
  if(!modal)return;
  modal.innerHTML=`<div class="row"><div><div class="eyebrow">PROJECT CALENDAR</div><h2>Schedule a project reminder</h2><p class="sub">${esc(state.project.name)}</p></div><button class="btn" onclick="closeModal()">×</button></div>
   <div class="calendar"><div class="cal-head"><button class="btn small" onclick="window.__calendarPrev()">←</button><b>${new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric"}).format(cursor)}</b><button class="btn small" onclick="window.__calendarNext()">→</button></div><div class="cal-grid">${cells}</div></div>
   <div class="grid g2" style="margin-top:14px"><div class="field"><label>Date</label><input id="remDate" type="date" value="${selected}"></div><div class="field"><label>Time</label><input id="remTime" type="time" value="10:00"></div></div>
   <div class="field"><label>Reminder</label><input id="remText" value="${selected==="2026-09-18"?"Kitchen installation":"Project milestone"}"></div>
   <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveReminder()">Save reminder</button></div>`;
 }
 window.__calendarPick=(ds)=>{selected=ds;const d=new Date(ds+"T12:00:00");cursor=new Date(d.getFullYear(),d.getMonth(),1);draw()};
 window.__calendarPrev=()=>{cursor.setMonth(cursor.getMonth()-1);draw()};
 window.__calendarNext=()=>{cursor.setMonth(cursor.getMonth()+1);draw()};
 window.__calendarDraw=draw;
 openModal("<div></div>");draw();
}
function saveReminder(){

 const id="rem"+Date.now();
 state.reminders=state.reminders||[];
 state.reminders.push({id,date,time,text,projectId:state.project.id});
 state.notifications.unshift({id:"n"+Date.now(),text:`Reminder set: ${text} · ${date} at ${time}`,read:false});
 state.activities.unshift({text:`Reminder scheduled: ${text}`,time:"Just now"});
 save();closeModal();toast("Reminder scheduled.");
}

 const sub=state.quotation.items.reduce((a,x)=>a+x[1],0),tax=Math.round(sub*.18),total=sub+tax;

 <div class="chat-actions" style="margin-top:10px">

function handleChatFiles(files){
 const incoming=[...(files||[])];
 if(!incoming.length)return;
 const max=5*1024*1024;
 const valid=incoming.filter(f=>f.size<=max);
 if(valid.length<incoming.length)toast("Files over 5 MB were skipped.");
 let remaining=valid.length;
 if(!state.chatDraft)state.chatDraft={attachments:[],references:[]};
 valid.forEach(file=>{
  const reader=new FileReader();
  reader.onload=()=>{state.chatDraft.attachments.push({name:file.name,type:file.type||"application/octet-stream",size:file.size,dataUrl:String(reader.result||"")});remaining--;if(remaining===0){save();render();toast(valid.length+" file"+(valid.length>1?"s":"")+" attached.");}};
  reader.onerror=()=>{remaining--;if(remaining===0){save();render();toast("Some files could not be attached.");}};
  reader.readAsDataURL(file);
 });
}
function removeChatAttachment(i){state.chatDraft.attachments.splice(i,1);save();render()}
function removeChatReference(i){state.chatDraft.references.splice(i,1);save();render()}

async function sendMessage(){
 const el=document.getElementById("chatInput");const text=el?.value.trim()||"";const atts=state.chatDraft?.attachments||[];const refs=state.chatDraft?.references||[];
 if(!text&&!atts.length&&!refs.length){toast("Write a message or attach something first.");return}
 const message={id:"m"+Date.now(),projectId:state.project.id,from:state.role,text:text||"Shared an attachment/reference.",attachments:atts.slice(),references:refs.slice(),createdAt:new Date().toISOString()};
 try{const r=await apiFetch("/api/messages",{method:"POST",headers:authHeaders(),body:JSON.stringify({message})});if(r.message)state.messages.push(r.message);state.chatDraft={attachments:[],references:[]};state.activities.unshift({text:"New project message sent",time:"Just now"});state.notifications.unshift({id:"n"+Date.now(),text:"New project message.",read:false});save(false);render();toast("Message sent.")}catch(e){toast(e.message||"Message could not be sent.")}
}

function portfolioPage(){return `<div class="row"><div><div class="eyebrow">PORTFOLIO</div><h1>Studio Nest portfolio</h1></div><button class="btn primary" onclick="addPortfolio()">+ Add project</button></div><div class="grid g3">${state.portfolio.map((p,i)=>`<div class="card"><div class="cover">${esc(p.name)}</div><b>${esc(p.name)}</b><div class="muted">${p.place}</div><div class="muted">${p.type} · ${p.budget} · ${p.style}</div><button class="btn small danger" style="margin-top:10px" onclick="deletePortfolio(${i})">Delete</button></div>`).join("")}</div>`}
function addPortfolio(){openModal(`<h2>Add portfolio project</h2><div class="field"><label>Project title *</label><input id="ppName"></div><div class="grid g2"><div class="field"><label>Location</label><input id="ppPlace" placeholder="Bangalore"></div><div class="field"><label>Property type</label><select id="ppType"><option>2BHK</option><option>3BHK</option><option>Villa</option><option>Office</option></select></div></div><div class="grid g2"><div class="field"><label>Budget</label><input id="ppBudget" placeholder="₹10–12L"></div><div class="field"><label>Style</label><input id="ppStyle" placeholder="Modern"></div></div><div class="field"><label>Description</label><textarea id="ppDesc"></textarea></div><div class="field"><label>Images</label><input type="file" multiple></div><div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitPortfolio()">Add project</button></div>`)}
function submitPortfolio(){const name=document.getElementById("ppName")?.value.trim();if(!name){toast("Project title is required.");return}state.portfolio.push({name,place:document.getElementById("ppPlace").value||"Bangalore",type:document.getElementById("ppType").value,budget:document.getElementById("ppBudget").value||"To be discussed",style:document.getElementById("ppStyle").value||"Modern"});save();closeModal();toast("Portfolio project added.");}
function deletePortfolio(i){openModal(`<h2>Delete portfolio project?</h2><p class="sub">This action can be undone only by resetting demo data.</p><div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="state.portfolio.splice(${i},1);save();closeModal();toast('Portfolio project deleted.');">Delete</button></div>`)}
function verificationPage(){return `<div class="eyebrow">VERIFICATION</div><h1>Designer verification</h1><p class="sub">Build trust before designers receive high-value projects.</p><div class="grid g2">${state.verification.map((v,i)=>`<div class="card"><div class="row"><div><h3>${v.name}</h3><div class="muted">${v.type}</div></div><span class="pill ${v.status==="Verified"?"green":"amber"}">${v.status}</span></div><div class="row" style="margin-top:14px">${v.status==="Pending"?`<button class="btn accent" onclick="verify(${i})">Verify</button><button class="btn danger" onclick="rejectVerify(${i})">Reject</button>`:`<button class="btn" disabled>Verified ✓</button>`}</div></div>`).join("")}</div>`}
function verify(i){state.verification[i].status="Verified";save();toast("Designer verified.");}
function rejectVerify(i){openModal(`<h2>Reject verification?</h2><textarea id="vr" rows="4" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:12px" placeholder="Reason"></textarea><div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="state.verification.splice(${i},1);save();closeModal();toast('Verification rejected.');render()">Reject</button></div>`)}
function adminDash(){return `<div class="eyebrow">ADMIN CONSOLE</div><h1>Platform overview</h1><p class="sub">Trust, projects, payments and marketplace health.</p><div class="grid g4">${[["12,480","Total users"],["1,240","Designers"],["860","Verified designers"],["318","Active projects"],["2,940","Completed projects"],["₹18.6L","Platform revenue"],["7","Open disputes"]].map(x=>`<div class="card"><div class="muted">${x[1]}</div><div class="metric">${x[0]}</div></div>`).join("")}</div><div style="height:18px"></div><div class="grid g2"><div class="card"><div class="row"><h3>Verification queue</h3><button class="btn small" onclick="nav('verification')">Open</button></div>${state.verification.slice(0,2).map(v=>`<div class="activity"><b>${v.name}</b><div class="muted">${v.type}</div></div>`).join("")}</div><div class="card"><h3>Recent disputes</h3><div class="activity"><b>Project #IH-2041</b><div class="muted">Quotation revision requested</div></div><div class="activity"><b>Project #IH-2034</b><div class="muted">Installation delay complaint</div></div></div></div>`}
function settingsPage(){return `<div class="eyebrow">SETTINGS</div><h1>Workspace settings</h1><p class="sub">Security, backend connection and local demo controls.</p><div class="grid g2"><div class="card"><h3>Backend</h3><div class="activity"><b>${apiOnline?"Connected":"Offline / not configured"}</b><div class="muted">${API_BASE||"No API URL configured. When served by the included backend, this uses the same origin."}</div></div><button class="btn" onclick="checkBackend().then(()=>toast(apiOnline?'Backend is reachable.':'Backend is not reachable.'))">Test connection</button></div><div class="card"><h3>Security</h3><div class="activity"><b>Role-based access</b><div class="muted">Role is taken from the authenticated account; there is no in-app role switch.</div></div><div class="activity"><b>SMS OTP</b><div class="muted">Available through the backend when an SMS provider is configured.</div></div></div></div><div class="card" style="margin-top:18px"><h3>Demo data</h3><p class="sub">Reset local approvals, projects, messages, leads and other demo changes.</p><button class="btn danger" onclick="resetDemo()">Reset local demo data</button></div>`}
function generic(title){
 const actions={
  "designers":()=>openModal(`<h2>Designer directory</h2><p class="sub">Verified marketplace designers currently visible to customers.</p>${state.designers.map(d=>`<div class="activity"><div class="row"><b>${esc(d.name)}</b><span class="pill ${d.verified?"green":"amber"}">${d.verified?"Verified":"Pending"}</span></div><div class="muted">${d.location} · ${d.budget} · ★ ${d.rating}</div></div>`).join("")}<div class="row" style="margin-top:15px"><button class="btn" onclick="closeModal()">Close</button></div>`),
  "payments":()=>nav(state.role==="designer"?"payments":"payments"),
  "reports":()=>openModal(`<h2>Platform report</h2><p class="sub">Demo snapshot generated from current local state.</p><div class="grid g2"><div class="card flat"><b>${state.users.length}</b><div class="muted">Registered demo users</div></div><div class="card flat"><b>${state.consultations.length}</b><div class="muted">Consultation requests</div></div><div class="card flat"><b>${state.messages.length}</b><div class="muted">Project messages</div></div><div class="card flat"><b>${state.designs.length}</b><div class="muted">Design versions</div></div></div><div class="row" style="margin-top:15px"><button class="btn" onclick="closeModal()">Close</button></div>`),
 };
 const fn=actions[title.toLowerCase()];
 return `<div class="card"><div class="eyebrow">INTERIORHUB</div><h1>${esc(title)}</h1><p class="sub">${title==="Designers"?"Review marketplace designers and verification status.":title==="Reports"?"Review live demo metrics.":"This section is connected to the shared demo state."}</p><button class="btn primary" onclick="${fn?`(${fn.toString()})()`:`toast('${esc(title)} is available in this demo.')`}">${title==="Designers"?"Open directory":title==="Reports"?"Open report":"Continue"}</button></div>`
}


function authPage(){
 const signup=state.authView!=="login"; const method=state.authMethod||"email"; const role=state.tempAuthRole||"customer";
 return `<div class="auth-page"><div class="auth-brand"><div class="brand">Interior<span>Hub</span></div><div class="muted">Find. Collaborate. Build.</div></div><div class="auth-card card"><div class="eyebrow">${signup?"GET STARTED":"WELCOME BACK"}</div><h1>${signup?"Create your InteriorHub account":"Sign in to InteriorHub"}</h1><p class="sub">${signup?"Start your interior project workspace in minutes.":"Continue to your projects, designers and conversations."}</p>
 <div class="auth-tabs"><button class="auth-tab ${method==="email"?"active":""}" onclick="setAuthView('${signup?"signup":"login"}','email')">Email</button><button class="auth-tab ${method==="phone"?"active":""}" onclick="setAuthView('${signup?"signup":"login"}','phone')">SMS OTP</button></div>
 ${signup?`<div class="auth-choice" style="display:flex;gap:8px;margin-bottom:12px"><button class="btn ${role==="customer"?"primary":""}" style="flex:1" onclick="setAuthRole('customer')">Homeowner</button><button class="btn ${role==="designer"?"primary":""}" style="flex:1" onclick="setAuthRole('designer')">Designer</button></div><div class="field"><label>Full name *</label><input id="authName" placeholder="Your full name"></div>`:""}
 ${method==="email"?`<div class="field"><label>Email *</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password *</label><input id="authPassword" type="password" autocomplete="${signup?"new-password":"current-password"}" placeholder="At least 8 characters"></div>`:`<div class="field"><label>Mobile number *</label><input id="authPhone" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210"></div><div class="otp-note">We'll send a one-time verification code by SMS. Never share your OTP.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="requestOtp('${signup?"signup":"login"}')">Send OTP</button></div><div class="field"><label>OTP</label><input id="authOtp" inputmode="numeric" maxlength="6" placeholder="6-digit code"></div>`}
 ${signup&&role==="designer"?`<div class="field"><label>Studio name</label><input id="authStudio" placeholder="Studio Nest"></div>`:""}
 <button class="btn primary" style="width:100%;margin-top:10px" onclick="${method==="email"?`submitAuth('${signup?"signup":"login"}')`:`verifyOtp('${signup?"signup":"login"}')`}">${signup?"Create account":"Sign in"}</button>
 <div class="auth-switch">${signup?`Already have an account? <button class="link-btn" onclick="setAuthView('login','email')">Log in</button>`:`New to InteriorHub? <button class="link-btn" onclick="setAuthView('signup','email')">Create account</button>`}</div><div class="notice" style="margin-top:16px;text-align:center"><span id="authBackendStatus">Checking secure backend…</span><div style="margin-top:8px"><button class="btn small" onclick="checkBackend();toast('Checking backend connection…')">Retry connection</button></div></div>
 <div class="muted" style="margin-top:14px;text-align:center;font-size:11px">By continuing, you agree to InteriorHub's Terms and Privacy Policy.</div></div></div>`
}
function setAuthView(view,method){state.authView=view;state.authMethod=method;render()}
function setAuthRole(role){state.tempAuthRole=role;render()}
function openAuth(mode="login",role="customer",method="email"){state.authView=mode;state.authMethod=method;state.tempAuthRole=role;closeModal();render()}
async function requestOtp(purpose){
 const phone=document.getElementById("authPhone")?.value.trim();
 if(!/^\+?[1-9]\d{9,14}$/.test(phone.replace(/\s+/g,""))){toast("Enter a valid international mobile number.");return}
 try{
  const r=await apiFetch("/api/auth/request-otp",{method:"POST",body:JSON.stringify({phone:phone.replace(/\s+/g,""),purpose})});
  state.pendingOtpPhone=phone.replace(/\s+/g,"");state.pendingOtpPurpose=purpose;save();
  if(r.devOtp) toast("Development OTP: "+r.devOtp); else toast("OTP sent by SMS.");
 }catch(e){toast(e.message||"Unable to send OTP.")}
}
async function verifyOtp(mode){
 const phone=state.pendingOtpPhone||document.getElementById("authPhone")?.value.trim();
 const otp=document.getElementById("authOtp")?.value.trim();
 if(!phone||!/^[0-9]{6}$/.test(otp||"")){toast("Enter the 6-digit OTP.");return}
 try{
  const r=await apiFetch("/api/auth/verify-otp",{method:"POST",body:JSON.stringify({phone,otp,purpose:state.pendingOtpPurpose||"login",role:state.tempAuthRole||"customer",name:document.getElementById("authName")?.value.trim()||"InteriorHub User",studio:document.getElementById("authStudio")?.value.trim()||""})});
  if(r.token){state.auth={loggedIn:true,token:r.token,user:r.user};state.page="dashboard";syncRoleFromAccount();save();closeModal();render();toast("Signed in securely.");return}
 }catch(e){
  // Backend is unavailable: do not silently fake an OTP login.
  toast(e.message||"Authentication service unavailable.");
 }
}
function chooseAuthRole(r){
 state.tempAuthRole=r;
 document.getElementById("arCustomer").className="btn "+(r==="customer"?"primary":"");
 document.getElementById("arDesigner").className="btn "+(r==="designer"?"primary":"");
 const f=document.getElementById("studioField");if(f)f.style.display=r==="designer"?"block":"none";
}

async function submitAuth(mode){
 const name=document.getElementById("authName")?.value.trim()||"";
 const email=document.getElementById("authEmail")?.value.trim().toLowerCase()||"";
 const pass=document.getElementById("authPassword")?.value||"";
 if(mode==="signup"&&!name){toast("Please enter your full name.");return}
 if(!/^\S+@\S+\.\S+$/.test(email)){toast("Enter a valid email address.");return}
 if(pass.length<8){toast("Password must be at least 8 characters.");return}
 try{
  const endpoint=mode==="signup"?"/api/auth/signup":"/api/auth/login";
  const payload=mode==="signup"?{name,email,password:pass,role:state.tempAuthRole||"customer",studio:document.getElementById("authStudio")?.value.trim()||""}:{email,password:pass};
  const r=await apiFetch(endpoint,{method:"POST",body:JSON.stringify(payload)});
  state.auth={loggedIn:true,token:r.token,user:r.user};state.authView="signup";state.page="dashboard";syncRoleFromAccount();
  await hydrateBackend();
  startRealtime();closeModal();render();toast(mode==="signup"?"Account created successfully.":"Signed in successfully.");
 }catch(e){toast(e.message||"Authentication service unavailable.")}
}
function profilePage(){const u=state.auth?.user||{};return `<div class="eyebrow">ACCOUNT</div><h1>Profile</h1><p class="sub">Manage your InteriorHub account.</p><div class="card"><div class="row"><div><h3>${esc(u.name||"User")}</h3><div class="muted">${esc(u.email||"")} ${u.phone?`· ${esc(u.phone)}`:""}</div></div><span class="pill green">${esc(roleLabel())}</span></div><hr class="hr"><button class="btn primary" onclick="openProfile()">Edit profile</button></div>`}
function openProfile(){
 const u=state.auth?.user||{name:"Aditi",email:"aditi@example.com"};
 openModal(`<div class="row"><div><div class="eyebrow">ACCOUNT</div><h2>Profile</h2></div><button class="btn" onclick="closeModal()">×</button></div>
 <div class="field"><label>Name</label><input id="pfName" value="${esc(u.name)}"></div>
 <div class="field"><label>Email</label><input id="pfEmail" value="${esc(u.email)}"></div>
 ${state.role==="designer"?`<div class="field"><label>Studio name</label><input id="pfStudio" value="${esc(state.designerProfile.businessName)}"></div><div class="notice">Verification: ${state.designerProfile.verified.identity?"✓ Identity ":"○ Identity "} ${state.designerProfile.verified.business?"✓ Business ":"○ Business "} ${state.designerProfile.verified.portfolio?"✓ Portfolio":"○ Portfolio"}</div>`:""}
 <div class="row" style="margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProfile()">Save changes</button></div>`);
}
function saveProfile(){
 if(!state.auth?.user)return;
 const oldEmail=state.auth.user.email;
 state.auth.user.name=document.getElementById("pfName")?.value.trim()||state.auth.user.name;
 state.auth.user.email=document.getElementById("pfEmail")?.value.trim().toLowerCase()||state.auth.user.email;
 if(state.users) {
  const u=state.users.find(x=>x.id===state.auth.user.id);
  if(u){u.name=state.auth.user.name;u.email=state.auth.user.email}
 }
 if(state.role==="designer")state.designerProfile.businessName=document.getElementById("pfStudio")?.value.trim()||state.designerProfile.businessName;
 state.activities.unshift({text:"Profile updated",time:"Just now"});save();closeModal();toast("Profile updated.");render()
}
function consultationInbox(){
 return `<div class="eyebrow">CONSULTATIONS</div><h1>Consultation requests</h1><p class="sub">Turn enquiries into real conversations with customers.</p><div class="card">${state.consultations.length?state.consultations.map(c=>`<div class="activity"><div class="row"><div><b>${esc(c.project)}</b><div class="muted">${esc(c.designer)} · ${esc(c.date)} · ${esc(c.time)}</div></div><span class="pill ${c.status==="Accepted"?"green":c.status==="Rejected"?"red":"amber"}">${c.status}</span></div><p class="sub">${esc(c.message||"No message added.")}</p>${state.role==="designer"&&c.status==="New"?`<div class="row"><button class="btn small accent" onclick="consultDecision('${c.id}','Accepted')">Accept</button><button class="btn small danger" onclick="consultDecision('${c.id}','Rejected')">Reject</button></div>`:""}</div>`).join(""):`<div class="empty">No consultation requests yet.</div>`}</div>`
}
function consultDecision(id,status){
 const c=state.consultations.find(x=>x.id===id);if(!c)return;
 c.status=status;state.activities.unshift({text:`Consultation ${status.toLowerCase()}: ${c.designer}`,time:"Just now"});
 state.notifications.unshift({id:"n"+Date.now(),text:`Consultation ${status.toLowerCase()} — ${c.designer}.`,read:false});
 save();toast("Consultation "+status.toLowerCase()+".")
}
function adminUsers(){
 return `<div class="eyebrow">USERS</div><h1>Users</h1><p class="sub">Manage the people using InteriorHub.</p><div class="card"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td><span class="pill">${u.role}</span></td><td><span class="pill green">${u.status}</span></td></tr>`).join("")}</tbody></table></div>`
}
async function logout(){try{await apiFetch("/api/auth/logout",{method:"POST",headers:authHeaders()})}catch{} stopRealtime();state.auth={loggedIn:false,user:null,token:null};state.authView="signup";state.authMethod="email";state.page="dashboard";state.role="customer";state.chatDraft={attachments:[],references:[]};localStorage.setItem(KEY,JSON.stringify(state));render()}
function page(){
 if(state.page==="dashboard")return state.role==="customer"?customerDash():state.role==="designer"?designerDash():adminDash();
 if(state.page==="discover")return discover();
 if(state.page==="projects")return projectsPage();
 if(state.page==="workspace")return workspace();
 if(state.page==="messages")return state.role==="customer"?projectMessagesPage():projectMessages();
 if(state.page==="notifications")return notificationsPage();
 if(state.page==="consultations")return consultationInbox();
 if(state.page==="users")return adminUsers();
 if(state.page==="leads")return leadsPage();
 if(state.page==="clients")return clientsPage();
 if(state.page==="portfolio")return portfolioPage();
 if(state.page==="quotations"){openWorkspace("Quotation");return workspace()}
 if(state.page==="materials"){openWorkspace("Materials");return workspace()}
 if(state.page==="payments"){openWorkspace("Payments");return workspace()}
 if(state.page==="verification")return verificationPage();
 if(state.page==="settings")return settingsPage();
 if(state.page==="profile")return profilePage();
 return generic(state.page);
}
function resetDemo(){if(confirm("Reset all InteriorHub demo data?")){localStorage.removeItem(KEY);state=load();toast("Demo data reset.");}}
function render(){
 try{
  save();
  if(state.auth?.loggedIn===false){
  document.getElementById("root").innerHTML=authPage();
  }else{
   document.getElementById("root").innerHTML=shell(page());
  }
  renderConnectionBadge();
 }catch(err){
  console.error(err);
  document.getElementById("root").innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px"><div class="card" style="max-width:620px"><div class="eyebrow">RECOVERY</div><h1>InteriorHub hit an unexpected error</h1><p class="sub">Your local data is preserved. Try reloading the page, or reset local demo data if the problem persists.</p><div class="row"><button class="btn" onclick="location.reload()">Reload</button><button class="btn danger" onclick="resetDemo()">Reset local data</button></div></div></div>`;
 }
}
if(!state.auth?.loggedIn){state.authView="signup";state.authMethod="email";localStorage.setItem(KEY,JSON.stringify(state));}
render();
</script>
